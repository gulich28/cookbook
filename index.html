<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Кулинарная книга</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family: Arial; background:#faf7f2; margin:0; }
    header { background:#ff7043; color:white; padding:20px; text-align:center; }
    .container { max-width:800px; margin:auto; padding:20px; }

    input, textarea {
      width:100%; margin:5px 0; padding:10px;
    }

    button {
      background:#ff7043; color:white; border:none;
      padding:10px; cursor:pointer;
    }

    .card {
      background:white; padding:15px; margin-top:15px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<header>
  <h1>🍲 Моя кулинарная книга</h1>
</header>

<div class="container">

  <h3>Добавить рецепт</h3>
  <input id="title" placeholder="Название">
  <textarea id="ingredients" placeholder="Ингредиенты"></textarea>
  <textarea id="steps" placeholder="Приготовление"></textarea>
  <button onclick="addRecipe()">Добавить</button>

  <h3>Рецепты</h3>
  <div id="recipes"></div>

</div>

<!-- Firebase -->

  // 🔥 ВСТАВЬ СЮДА СВОЙ CONFIG

  projectId: "cookbook-62f7e",
  storageBucket: "cookbook-62f7e.firebasestorage.app",
  messagingSenderId: "654857944608",
  appId: "1:654857944608:web:96cafa723d5ccd67b1c645"
};

  const app = initializeApp(firebaseConfig);

  // ➕ Добавить рецепт
  window.addRecipe = async function () {
    await addDoc(col, {
      title: document.getElementById("title").value,
      ingredients: document.getElementById("ingredients").value,
      steps: document.getElementById("steps").value
    });

    document.getElementById("title").value = "";
    document.getElementById("ingredients").value = "";
    document.getElementById("steps").value = "";
  }

  // 📄 Реальное время (обновляется автоматически)
  const recipesDiv = document.getElementById("recipes");

  onSnapshot(col, (snapshot) => {
    recipesDiv.innerHTML = "";
    snapshot.forEach(doc => {
      const r = doc.data();
      recipesDiv.innerHTML += `
        <div class="card">
          <h3>${r.title}</h3>
          <b>Ингредиенты:</b>
          <p>${r.ingredients}</p>
          <b>Приготовление:</b>
          <p>${r.steps}</p>
        </div>
      `;
    });
  });

</script>

</body>
</html>
