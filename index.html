<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Кулинарная книга (Supabase + Realtime + Storage)</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }

    header {
      background: #ff6b6b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }

    .form {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .recipes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .delete {
      background: #333;
      flex: 1;
    }

    .edit {
      background: #ffa94d;
      flex: 1;
    }

    .small {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🍲 Кулинарная книга (Supabase)</h1>
</header>

<div class="container">

  <div class="form">
    <h3 id="formTitle">Добавить рецепт</h3>
    <input id="title" placeholder="Название рецепта" />
    <textarea id="text" rows="4" placeholder="Описание рецепта"></textarea>

    <!-- URL картинки (опционально) -->
    <input id="imageUrl" placeholder="Ссылка на изображение (URL, необязательно)" />

    <!-- Загрузка файла в Supabase Storage -->
    <label class="small">Или загрузить картинку файлом:</label>
    <input id="imageFile" type="file" accept="image/*" />

    <button id="submitBtn" onclick="submitRecipe()">Добавить рецепт</button>
    <button id="cancelEditBtn" style="display:none; margin-left:8px; background:#777;" onclick="cancelEdit()">Отмена</button>
  </div>

  <div class="recipes" id="recipes"></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // 🔥 ВСТАВЬ СВОИ ДАННЫЕ:
  const supabaseUrl = "https://qnbvtpxxjjfjwayjojgt.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuYnZ0cHh4ampmandheWpvamd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjk3MjUsImV4cCI6MjA5MTc0NTcyNX0.SwIbelixyUi5Bomis2qUKHCYttMpH3sPLHiQf1aa2y4";

  const supabase = createClient(supabaseUrl, supabaseKey);

  const recipesDiv = document.getElementById("recipes");
  const titleInput = document.getElementById("title");
  const textInput = document.getElementById("text");
  const imageUrlInput = document.getElementById("imageUrl");
  const imageFileInput = document.getElementById("imageFile");
  const formTitle = document.getElementById("formTitle");
  const submitBtn = document.getElementById("submitBtn");
  const cancelEditBtn = document.getElementById("cancelEditBtn");

  let editingId = null; // если null — создаём, если есть — редактируем

  // ====== ЗАГРУЗКА СПИСКА РЕЦЕПТОВ ======
  async function loadRecipes() {
    const { data, error } = await supabase
      .from("recipes")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      return;
    }

    renderRecipes(data);
  }

  function renderRecipes(data) {
    recipesDiv.innerHTML = "";

    data.forEach((item) => {
      recipesDiv.innerHTML += `
        <div class="card">
          <img src="${item.image || 'https://via.placeholder.com/300?text=Нет+фото'}" />
          <div class="card-content">
            <h3>${item.title}</h3>
            <p>${item.text}</p>
            <div class="actions">
              <button class="edit" onclick="startEdit('${item.id}', '${encodeURIComponent(item.title)}', '${encodeURIComponent(item.text)}', '${encodeURIComponent(item.image || "")}')">Редактировать</button>
              <button class="delete" onclick="deleteRecipe('${item.id}')">Удалить</button>
            </div>
          </div>
        </div>
      `;
    });
  }

  // ====== REALTIME ОБНОВЛЕНИЕ ======
  // Подписка на изменения в таблице recipes
  supabase
    .channel('public:recipes')
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'recipes' },
      (payload) => {
        // Можно было бы обновлять точечно, но для простоты перезагрузим список
        loadRecipes();
      }
    )
    .subscribe();

  // Первичная загрузка
  loadRecipes();

  // ====== ЗАГРУЗКА КАРТИНКИ В STORAGE ======
  async function uploadImageIfNeeded() {
    const file = imageFileInput.files[0];
    const directUrl = imageUrlInput.value.trim();

    // Если есть прямой URL — используем его
    if (directUrl) {
      return directUrl;
    }

    // Если файла нет — возвращаем пустую строку
    if (!file) {
      return "";
    }

    // Имя файла — уникальное
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}.${fileExt}`;
    const filePath = `recipes/${fileName}`;

    const { error: uploadError } = await supabase
      .storage
      .from("recipes-images") // 🔥 НАЗВАНИЕ ТВОЕГО BUCKET
      .upload(filePath, file);

    if (uploadError) {
      console.error(uploadError);
      alert("Ошибка загрузки изображения");
      return "";
    }

    const { data } = supabase
      .storage
      .from("recipes-images")
      .getPublicUrl(filePath);

    return data.publicUrl || "";
  }

  // ====== ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ РЕЦЕПТА ======
  window.submitRecipe = async function () {
    const title = titleInput.value.trim();
    const text = textInput.value.trim();

    if (!title || !text) {
      alert("Заполни название и описание!");
      return;
    }

    const image = await uploadImageIfNeeded();

    if (!editingId) {
      // Создание
      const { error } = await supabase.from("recipes").insert({
        title,
        text,
        image
      });

      if (error) {
        console.error(error);
        alert("Ошибка при добавлении рецепта");
        return;
      }
    } else {
      // Обновление
      const { error } = await supabase
        .from("recipes")
        .update({
          title,
          text,
          image
        })
        .eq("id", editingId);

      if (error) {
        console.error(error);
        alert("Ошибка при обновлении рецепта");
        return;
      }
    }

    resetForm();
  };

  function resetForm() {
    editingId = null;
    titleInput.value = "";
    textInput.value = "";
    imageUrlInput.value = "";
    imageFileInput.value = "";
    formTitle.textContent = "Добавить рецепт";
    submitBtn.textContent = "Добавить рецепт";
    cancelEditBtn.style.display = "none";
  }

  // ====== НАЧАТЬ РЕДАКТИРОВАНИЕ ======
  window.startEdit = function (id, encodedTitle, encodedText, encodedImage) {
    editingId = id;
    titleInput.value = decodeURIComponent(encodedTitle);
    textInput.value = decodeURIComponent(encodedText);
    const img = decodeURIComponent(encodedImage);
    imageUrlInput.value = img || "";
    imageFileInput.value = ""; // файл заново, если нужно

    formTitle.textContent = "Редактировать рецепт";
    submitBtn.textContent = "Сохранить изменения";
    cancelEditBtn.style.display = "inline-block";
  };

  window.cancelEdit = function () {
    resetForm();
  };

  // ====== УДАЛЕНИЕ РЕЦЕПТА ======
  window.deleteRecipe = async function (id) {
    if (!confirm("Точно удалить рецепт?")) return;

    const { error } = await supabase
      .from("recipes")
      .delete()
      .eq("id", id);

    if (error) {
      console.error(error);
      alert("Ошибка при удалении");
    }
  };
</script>

</body>
</html>
