<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Кулинарная книга</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }

    header {
      background: #ff6b6b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }

    .form {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .recipes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 10px;
    }

    .delete {
      background: #333;
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>

<body>

<header>
  <h1>🍲 Кулинарная книга</h1>
</header>

<div class="container">

  <div class="form">
    <input id="title" placeholder="Название рецепта" />
    <textarea id="text" rows="4" placeholder="Описание рецепта"></textarea>
    <input id="imageUrl" placeholder="Ссылка на изображение (URL)" />
    <button onclick="addRecipe()">Добавить рецепт</button>
  </div>

  <div class="recipes" id="recipes"></div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    deleteDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDF4ffOkfFUQNtiXIuR2gsjB2xWaJhzrzw",
    authDomain: "cookbook-62f7e.firebaseapp.com",
    projectId: "cookbook-62f7e",
    storageBucket: "cookbook-62f7e.firebasestorage.app",
    messagingSenderId: "654857944608",
    appId: "1:654857944608:web:96cafa723d5ccd67b1c645"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const recipesDiv = document.getElementById("recipes");

  // загрузка рецептов
  onSnapshot(collection(db, "recipes"), (snapshot) => {
    recipesDiv.innerHTML = "";
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();

      recipesDiv.innerHTML += `
        <div class="card">
          <img src="${data.image || 'https://via.placeholder.com/300?text=Нет+фото'}" />
          <div class="card-content">
            <h3>${data.title}</h3>
            <p>${data.text}</p>
            <button class="delete" onclick="deleteRecipe('${docSnap.id}')">Удалить</button>
          </div>
        </div>
      `;
    });
  });

  // добавление рецепта
  window.addRecipe = async function () {
    const title = document.getElementById("title").value;
    const text = document.getElementById("text").value;
    const imageUrl = document.getElementById("imageUrl").value;

    if (!title || !text) return alert("Заполни поля!");

    await addDoc(collection(db, "recipes"), {
      title,
      text,
      image: imageUrl || "",
      createdAt: serverTimestamp()
    });

    document.getElementById("title").value = "";
    document.getElementById("text").value = "";
    document.getElementById("imageUrl").value = "";
  };

  // удаление рецепта
  window.deleteRecipe = async function (id) {
    await deleteDoc(doc(db, "recipes", id));
  };
</script>

</body>
</html>
